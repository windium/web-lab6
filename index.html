<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Post Dashboard</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f5f5f7; color: #1d1d1f; }
      main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
      h1 { margin-top: 0; }
      .filter-form { display: flex; flex-direction: column; gap: 6px; margin-bottom: 20px; }
      .filter-form input { padding: 10px 12px; font-size: 16px; border: 1px solid #c7c7cc; border-radius: 8px; }
      .status { padding: 12px; background: #fff; border-radius: 8px; }
      .status.error { color: #b00020; background: #fdecea; }
      .post-list { display: flex; flex-direction: column; gap: 12px; }
      .post { background: #fff; padding: 14px 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
      .post h2 { font-size: 18px; margin: 0 0 6px; text-transform: capitalize; }
      .post p { margin: 0; line-height: 1.5; color: #444; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
